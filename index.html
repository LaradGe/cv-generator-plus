<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV გენერატორი</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>შექმენი შენი CV</h1>
    <form id="cvForm" onsubmit="event.preventDefault(); generatePDF();">
      <div class="form-group">
        <label for="name">სახელი, გვარი:</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="email">ელფოსტა:</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="position">პოზიცია:</label>
        <input type="text" id="position" required>
      </div>
      <div class="form-group">
        <label for="education">განათლება:</label>
        <textarea id="education" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label for="experience">სამუშაო გამოცდილება:</label>
        <textarea id="experience" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label for="skills">უნარები და ენები:</label>
        <textarea id="skills" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label for="social">სოციალური ქსელები:</label>
        <input type="text" id="social" placeholder="LinkedIn, GitHub, Facebook">
      </div>
      <button type="submit">⬇ გადმოწერე PDF</button>
    </form>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
